[package]
name = "aggr-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false
description = "Native development and release tools for aggr"

[dependencies]
aggr-ui-build = { path = "../aggr-ui-build", version = "0.1.0" }
aggr-ui-model = { path = "../aggr-ui-model", version = "0.1.0", features = ["typescript"] }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
fantoccini = { version = "0.22.1", default-features = false }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
notify = "8.2.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rquickjs = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tar = "0.4.46"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "signal", "sync", "time"] }
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
httpmock = "0.8.3"
