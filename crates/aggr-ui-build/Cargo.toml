[package]
name = "aggr-ui-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
description = "Native compiler and bundler for the aggr Svelte reader"
repository = "https://github.com/aymericbeaumet/aggr"
include = ["/src/**", "/vendor/**", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
oxc_allocator = "=0.155.0"
oxc_codegen = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_transformer = "=0.155.0"
rolldown = "=1.2.15"
rolldown_common = "=1.2.15"
rolldown_plugin = "=1.2.15"
rayon = "1.12.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "sync", "time"] }
walkdir = "2.5.0"
