[package]
name = "aggr-ui-model"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Typed page contracts for the aggr feed reader"
repository = "https://github.com/aymericbeaumet/aggr"

[features]
typescript = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }
