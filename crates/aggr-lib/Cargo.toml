[package]
name = "aggr-lib"
version = "2.0.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
description = "Git-native feed reader: aggr.toml in, static site out, history on a branch"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
repository = "https://github.com/aymericbeaumet/aggr"
readme = "README.md"
keywords = ["rss", "atom", "feed", "reader", "static-site"]
categories = ["command-line-utilities", "web-programming"]

include = ["src/**", "build.rs", "README.md", "LICENSE", ".generated/publish/**"]

[build-dependencies]
aggr-ui-model = { path = "../aggr-ui-model", version = "0.1.0", features = ["typescript"] }
sha2 = "0.11"

[dependencies]
aggr-ui-model = { path = "../aggr-ui-model", version = "0.1.0" }
ammonia = "4"
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comrak = { version = "0.56", default-features = false }
dom_smoothie = "0.18"
directories = "6"
encoding_rs = "0.8"
# 3.x drops media it does not consider content; src/sources/feed.rs restores it from the XML.
feed-rs = "3"
futures-util = "0.3"
glob = "0.3"
hayro = { version = "0.8.0", features = ["embed-fonts"] }
hex = "0.4"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
jpeg-encoder = "0.7.1"
log = "0.4"
notify = "8"
pagefind = { version = "1.5.2", default-features = false }
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "gzip",
  "brotli",
  "json",
  "charset",
  "http2",
  "stream",
] }
rquickjs = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
slug = "0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1"
url = { version = "2", features = ["serde"] }
unicode-segmentation = "1"
walkdir = "2"
# These Apache-2.0 releases support the project's MSRV; newer releases require Rust 1.98.
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "gzip", "brotli", "stream"] }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }
thumbhash = "0.1.0"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }

[dev-dependencies]
env_logger = "0.11"
httpmock = "0.8"
insta = "1"
png = "0.18"
tokio = { version = "1", features = ["test-util"] }
