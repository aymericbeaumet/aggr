[package]
name = "aggr-lib"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
description = "Git-native feed reader: aggr.toml in, static site out, history on a branch"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
repository = "https://github.com/aymericbeaumet/aggr"
readme = "README.md"
keywords = ["rss", "atom", "feed", "reader", "static-site"]
categories = ["command-line-utilities", "web-programming"]

include = ["src/**", "build.rs", "README.md", "LICENSE", ".generated/publish/**"]

[build-dependencies]
aggr-ui-build = { path = "../aggr-ui-build", version = "0.1.0" }
aggr-ui-model = { path = "../aggr-ui-model", version = "0.1.0", features = ["typescript"] }
sha2 = "0.11.1"
serde_json = "1.0.154"

[dependencies]
aggr-ui-model = { path = "../aggr-ui-model", version = "0.1.0" }
ammonia = "4.2.4"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comrak = { version = "0.59.0", default-features = false }
dom_smoothie = "0.19.0"
directories = "6.0.0"
encoding_rs = "0.8.42"
# 3.x drops media it does not consider content; src/sources/feed.rs restores it from the XML.
feed-rs = "3.0.0"
futures-util = "0.3.34"
glob = "0.3.4"
hayro = { version = "0.8.0", features = ["embed-fonts"] }
hex = "0.4.3"
htmd = "0.5.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
jpeg-encoder = "0.7.1"
log = "0.4.34"
notify = "8.2.0"
pagefind = { version = "1.5.2", default-features = false }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "gzip",
  "brotli",
  "json",
  "charset",
  "http2",
  "stream",
] }
rquickjs = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
# Keep emitted bytes independent of Cargo feature unification with the native bundler.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
slug = "0.1.6"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
# Both stable releases are Apache-2.0; older wreq-util 0.1 is GPL-3.0.
wreq = { version = "=0.16.1", default-features = false, features = ["webpki-roots", "tokio-rt", "gzip", "brotli", "stream"] }
wreq-util = { version = "=0.2.0", default-features = false, features = ["emulation"] }
thumbhash = "0.1.0"
resvg = { version = "0.49.0", default-features = false, features = ["text"] }

[dev-dependencies]
env_logger = "0.11.11"
httpmock = "0.9.0"
insta = "1.49.0"
png = "0.18.1"
tokio = { version = "1.54.0", features = ["test-util"] }
