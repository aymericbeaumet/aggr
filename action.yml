name: aggr
description: Install the aggr binary and put it on PATH. Pair with `aggr sync` / `aggr build` in your own steps, or use the reusable workflow instead.
branding:
  icon: rss
  color: gray-dark

inputs:
  version:
    description: Release to install, e.g. `1.2.3`. Defaults to the version this action was tagged with.
    required: false
    default: ""
  token:
    description: Token used to query and download releases (avoids API rate limits).
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      uses: $/.github/actions/install
      with:
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
