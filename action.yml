name: aggr
description: Install the aggr binary and put it on PATH. Pair with `aggr sync` / `aggr build` in your own steps, or use the reusable workflow instead.
branding:
  icon: rss
  color: gray-dark

inputs:
  version:
    description: Exact release (`1.2.3`) or compatible major channel (`1`). Defaults to the action's channel.
    required: false
    default: ""
  token:
    description: Token used to query and download releases (avoids API rate limits).
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        # Composite-action contexts must cross into the shell through the environment.
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: aymericbeaumet/aggr
      run: |
        set -euo pipefail

        # Explicit input > version-like action ref > major declared beside this action > latest.
        # Exact semver pins. A bare major resolves at run time, so a stable workflow `@v1`
        # automatically installs the greatest published v1.x.y release.
        requested="${INPUT_VERSION#v}"
        if [ -z "$requested" ] && [[ "$ACTION_REF" =~ ^v?[0-9]+(\.[0-9]+\.[0-9]+)?$ ]]; then
          requested="${ACTION_REF#v}"
        fi
        if [ -z "$requested" ] && [ -f "$ACTION_PATH/VERSION" ]; then
          declared="$(tr -d '[:space:]' < "$ACTION_PATH/VERSION")"
          requested="${declared%%.*}"
        fi
        if [ -z "$requested" ]; then
          requested="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
          requested="${requested#v}"
        fi

        if [[ "$requested" =~ ^[0-9]+$ ]]; then
          major="$requested"
          tag="$(gh release list \
            --repo "$REPO" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1000 \
            --json tagName \
            --jq "map(select(.tagName | test(\"^v${major}\\\\.[0-9]+\\\\.[0-9]+$\"))) | max_by(.tagName | ltrimstr(\"v\") | split(\".\") | map(tonumber)) | .tagName // empty")"
          if [ -z "$tag" ]; then
            echo "no published aggr v$major release exists" >&2
            exit 1
          fi
          version="${tag#v}"
        elif [[ "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          version="$requested"
        else
          echo "invalid aggr version '$requested': use a major channel like 1 or an exact version like 1.3.0" >&2
          exit 1
        fi

        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        if [ "$os" = windows ]; then archive="aggr-$os-$arch.zip"; else archive="aggr-$os-$arch.tar.gz"; fi

        dir="$RUNNER_TEMP/aggr/bin"
        mkdir -p "$dir"
        cd "$RUNNER_TEMP/aggr"
        gh release download "v$version" --repo "$REPO" --pattern "$archive" --pattern SHA256SUMS --clobber
        expected="$(awk -v file="$archive" '$2 == file { print $1 }' SHA256SUMS)"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$archive" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
        fi
        [ -n "$expected" ] && [ "$actual" = "$expected" ] || { echo "checksum mismatch for $archive" >&2; exit 1; }
        if [ "$os" = windows ]; then unzip -oq "$archive" -d bin; else tar -xzf "$archive" -C bin; fi

        echo "$dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "installed aggr $version ($os-$arch)"
