# A small first reader. `aggr init --defaults` lists every general default.

[site]
title = "My reads"
# url = "https://reads.example.com" # custom domain; also writes CNAME

[defaults]
content_download_strategy = "feed"
media_download_strategy = "remote"
count_max = 250
max_age_days = 730
size_max = "1GB"

[[sources]]
url = "https://blog.rust-lang.org"
category = "programming"

