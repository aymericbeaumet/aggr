{# The complete search shell is rendered here; search.js only fills it in. Without JavaScript the
   form still submits to ?q=, which lands on this feed. #}
<div class="feed-toolbar" data-nosnippet>
  <div data-search-root{% if page.kind == 'source' and source %} data-scope-kind="source" data-scope-value="{{ source.slug }}"{% elif page.kind in ['category', 'tag'] and category %} data-scope-kind="{{ page.kind }}" data-scope-value="{{ category.slug }}"{% endif %}>
    <div class="search-control" role="group" aria-label="Search controls">
      <div class="search-command">
        <form class="feed-search" id="search-form" action="{{ '' | url_for }}" method="get" role="search">
          <label class="sr-only" for="q">Search articles</label>
          <div class="search-input-line">
            <input id="q" type="search" name="q" value="{% if page.kind == 'source' and source %}source:{{ source.slug }} {% elif page.kind in ['category', 'tag'] and category %}{{ page.kind }}:{{ category.slug }} {% endif %}" placeholder="Search articles, sources, categories…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-describedby="search-query-help" data-page-search aria-keyshortcuts="Meta+K Control+K">
            <button type="button" class="search-clear" aria-label="Clear search" hidden>×</button>
          </div>
        </form>
        <div data-search-completions-root></div>
      </div>
      <div id="search-query-help" class="search-query-help" role="tooltip">
        <span>Use <code>source:</code>, <code>category:</code>, <code>tag:</code>, <code>type:</code>, <code>date:</code>, <code>sort:</code>, <code>"exact phrases"</code> or <code>-exclude</code>.</span>
      </div>
    </div>
    <p class="search-error" role="alert" hidden></p>
    <noscript><p class="search-offline">Full-text search needs JavaScript. Without it, browse by <a href="{{ 'browse/' | url_for }}">category, source or tag</a>.</p></noscript>
  </div>
</div>
<div data-search-results-root></div>
