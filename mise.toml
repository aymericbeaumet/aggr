[settings]
lockfile = true

[tools]
actionlint = "1.7.12"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
cmake = "4.4.4"
node = "26.12.0"
ninja = "1.13.2"
rust = { version = "1.99.1", profile = "default" }

# Keep the browser and driver on the same checksum-pinned Chrome for Testing release.
[tools."http:chromedriver"]
version = "155.0.8059.84"
os = ["linux/x64", "macos", "windows/x64"]

[tools."http:chromedriver".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chromedriver-linux64.zip", checksum = "sha256:4fe2433044363e5233d642e70fa50278b471bda08032d922402c8bd7c6d743fd", bin_path = "chromedriver-linux64" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chromedriver-mac-arm64.zip", checksum = "sha256:6db09f1272851bdcd5137d04797b5506993291e8499e8fa8153ab1c571bba20c", bin_path = "chromedriver-mac-arm64" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chromedriver-mac-x64.zip", checksum = "sha256:70cd983d37e887a76fcdedf479a2959f0b41d1161f813c6c442ab094395e9bdb", bin_path = "chromedriver-mac-x64" }
windows-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/win64/chromedriver-win64.zip", checksum = "sha256:0e629a3ef7f2be8562b857253053ebb0f871f55240f80124cd31974380ad1f3a", bin_path = "chromedriver-win64" }

[tools."http:chrome-for-testing"]
version = "155.0.8059.84"
os = ["linux/x64", "macos", "windows/x64"]

[tools."http:chrome-for-testing".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-linux64.zip", checksum = "sha256:cf0f049892dea22e6a6db26d47ed0d7776b7158edcbec4634086633df8bafcbc", bin_path = "chrome-linux64" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-mac-arm64.zip", checksum = "sha256:13b9e98ce56f5ce18e100a009f455c9285f399e7c9dc8a76fdf2f3a9755bb5f2", bin_path = "chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-mac-x64.zip", checksum = "sha256:d805a173118daa5f6f5cf464500789e1e00022a9a6aed8abfec821ab828fa862", bin_path = "chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS" }
windows-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/win64/chrome-win64.zip", checksum = "sha256:507f2a031441d10c62b5e3d4e863f09ac1198a571c1419976cbd8387f639afde", bin_path = "chrome-win64" }

# BoringSSL's x64 assembly build needs NASM on Windows.
[tools."http:nasm"]
version = "3.02"
os = ["windows/x64"]

[tools."http:nasm".platforms]
windows-x64 = { url = "https://www.nasm.us/pub/nasm/releasebuilds/{{ version }}/win64/nasm-{{ version }}-win64.zip", checksum = "sha256:161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7", bin_path = "nasm-{{ version }}" }
