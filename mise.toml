min_version = "2026.10.17"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64", "windows-arm64"]
exec_auto_install = false

[settings.cargo]
# Build the Intel macOS audit tool from its published, locked Cargo sources.
binstall = false

[settings.task]
# Setup provisions tools explicitly; CI installs only the subset each job needs.
run_auto_install = false

[tools]
"github:jdx/jactionlint" = "2.6.0"
shellcheck = "0.11.0"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.22.0", os = ["linux", "windows", "macos/arm64"] }
"cargo:cargo-deny" = { version = "0.22.0", os = ["macos/x64"] }
cmake = "4.5.1"
ninja = "1.13.2"
rust = { version = "1.100.0", profile = "default" }

# Keep the browser and driver on the same checksum-pinned Chrome for Testing release.
[tools."http:chromedriver"]
version = "158.0.8127.36"
os = ["linux/x64", "linux/arm64", "macos", "windows/x64"]

[tools."http:chromedriver".platforms]
linux-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux-arm64/chromedriver-linux-arm64.zip", checksum = "sha256:cbb268390b87b79ad8543364bbf5cc851b1403a2ce76c2636dfc2fbe8e196b7d", bin_path = "chromedriver-linux-arm64" }
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chromedriver-linux64.zip", checksum = "sha256:d20e70d69d68c5c983e2526452ed0779fd65dc4ade5d6741f1bb3d0d82754d3a", bin_path = "chromedriver-linux64" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chromedriver-mac-arm64.zip", checksum = "sha256:e44347354ea6a7b666e4ef03803974e1344f78ce9c4466acd896ea6af53136e8", bin_path = "chromedriver-mac-arm64" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chromedriver-mac-x64.zip", checksum = "sha256:707e35dcfc37c73305ceea27b8a3dba357b3f663562790975962293ad37efe1d", bin_path = "chromedriver-mac-x64" }
windows-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/win64/chromedriver-win64.zip", checksum = "sha256:ed65348ea2ffce89a0e747f5d20b31c521b59364269d6b2d3a6635872db53017", bin_path = "chromedriver-win64" }

[tools."http:chrome-for-testing"]
version = "158.0.8127.36"
os = ["linux/x64", "linux/arm64", "macos", "windows/x64"]

[tools."http:chrome-for-testing".platforms]
linux-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux-arm64/chrome-linux-arm64.zip", checksum = "sha256:f811b64a50cbc73f94fda7b3f3b3bf62be5d9409b3207e6ead9b61e6706afffe", bin_path = "chrome-linux-arm64" }
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-linux64.zip", checksum = "sha256:dba9cc838e1ce269c33ea68170881127bd15d078fc3ca5891c90802819a4d7c7", bin_path = "chrome-linux64" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-mac-arm64.zip", checksum = "sha256:b86d3b393def1f87d369b022abff0a51acb015d6fcb79ddfd1c379c9d72fbbe2", bin_path = "chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-mac-x64.zip", checksum = "sha256:1390e9b1386a1fd8ec2c4940b9ff59cbbda71b896b85182d7efbd73c58213802", bin_path = "chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS" }
