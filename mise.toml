[settings]
lockfile = true

[tools]
actionlint = "1.7.12"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
cmake = "4.4.4"
node = "26.12.0"
ninja = "1.13.2"
chromedriver = "155.0.8059.39"
rust = { version = "1.99.0", profile = "default" }

# Keep the browser and driver on the same Chrome for Testing release.
[tools."http:chrome-for-testing"]
version = "155.0.8059.39"
os = ["linux/x64", "macos", "windows/x64"]

[tools."http:chrome-for-testing".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-linux64.zip", checksum = "sha256:55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea", bin_path = "chrome-linux64" }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-mac-arm64.zip", checksum = "blake3:eed1cf6778376cef1ff6598c8edbb115cabd41f97bede274008eff8b016dfccc", bin_path = "chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS" }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-mac-x64.zip", checksum = "sha256:9e4da7961d4a426078f02e89ecfa569a7926ada2dc88aa53c0bd9ed0d46c3bb7", bin_path = "chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS" }
windows-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/win64/chrome-win64.zip", checksum = "sha256:59ab2a6e99bde9c0bc180414988394f9f5355a0d3764c704151ee8ecea235c7e", bin_path = "chrome-win64" }

# BoringSSL's x64 assembly build needs NASM on Windows.
[tools."http:nasm"]
version = "3.02"
os = ["windows/x64"]

[tools."http:nasm".platforms]
windows-x64 = { url = "https://www.nasm.us/pub/nasm/releasebuilds/{{ version }}/win64/nasm-{{ version }}-win64.zip", checksum = "sha256:161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7", bin_path = "nasm-{{ version }}" }
