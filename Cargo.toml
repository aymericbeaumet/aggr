[package]
name = "aggr"
version = "1.6.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Git-native feed reader: aggr.toml in, static site out, history on a branch"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
repository = "https://github.com/aymericbeaumet/aggr"
readme = "readme.md"
keywords = ["rss", "atom", "feed", "reader", "static-site"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
ammonia = "4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comrak = { version = "0.54", default-features = false }
dom_smoothie = "0.18"
directories = "6"
encoding_rs = "0.8"
env_logger = "0.11"
feed-rs = "2"
futures-util = "0.3"
glob = "0.3"
hex = "0.4"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
log = "0.4"
minijinja = { version = "2", features = ["loader", "json"] }
notify = "8"
pagefind = { version = "1.5.2", default-features = false }
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "gzip",
  "brotli",
  "json",
  "charset",
  "http2",
] }
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.11"
slug = "0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1"
url = { version = "2", features = ["serde"] }
unicode-segmentation = "1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
fantoccini = { version = "0.22", default-features = false }
httpmock = "0.8"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
insta = "1"
png = "0.18"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
# Generic image decoders are instantiated in aggr itself, not just their dependency crates.
opt-level = 1

[profile.dev.package."*"]
opt-level = 0

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# Keep image decoding, resizing and lossless encoding practical during local dev syncs.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
