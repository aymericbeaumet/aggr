[package]
name = "aggr"
default-run = "aggr"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
description = "Git-native feed reader: aggr.toml in, static site out, history on a branch"
authors = ["Aymeric Beaumet <hi@aymericbeaumet.com>"]
repository = "https://github.com/aymericbeaumet/aggr"
readme = "readme.md"
keywords = ["rss", "atom", "feed", "reader", "static-site"]
categories = ["command-line-utilities", "web-programming"]
include = ["/src/main.rs", "/src/dev_worker.rs", "/readme.md", "/LICENSE", "/THIRD_PARTY_NOTICES", "/Cargo.lock"]

[workspace]
members = ["crates/aggr-lib", "crates/aggr-ui-model", "crates/aggr-ui-build", "crates/aggr-tools"]

[features]
dev-worker = []

[[bin]]
name = "aggr-dev-worker"
path = "src/dev_worker.rs"
required-features = ["dev-worker"]
test = false
bench = false

[dependencies]
aggr-lib = { path = "crates/aggr-lib", version = "2.0.0" }
env_logger = "0.11.11"
log = "0.4.35"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
chrono = { version = "0.4.45", features = ["serde"] }
fantoccini = { version = "0.22.1", default-features = false }
futures-util = "0.3.34"
hex = "0.4.3"
httpmock = "0.9.0"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
predicates = "3.1.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "gzip",
  "brotli",
  "json",
  "charset",
  "http2",
  "stream",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29.0"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
slug = "0.1.6"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["time"] }
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"

[profile.dev]
# Generic image decoders are instantiated in aggr itself, not just their dependency crates.
opt-level = 1
# Backtraces and profiles only need line numbers; full DWARF dominates the edit-compile-run loop.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# These run on every UI edit; keep native compiler and JavaScript execution fast in dev.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rolldown]
opt-level = 3

[profile.dev.package.oxc_parser]
opt-level = 3

[profile.dev.package.oxc_transformer]
opt-level = 3

[profile.dev.package.oxc_codegen]
opt-level = 3

[profile.dev.package.lightningcss]
opt-level = 3

# Asset validation hashes retained bytes even when their decoded metadata is cached.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Keep image decoding, resizing and lossless encoding practical during local dev syncs.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.thumbhash]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
