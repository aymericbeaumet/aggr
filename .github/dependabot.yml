version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/native-deps"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      native-compiler:
        patterns: ["oxc_*", "rolldown", "rolldown_*"]
    ignore:
      # The challenge-fallback transport tracks BoringSSL; its upgrades are validated by hand.
      - dependency-name: wreq
      - dependency-name: wreq-util
