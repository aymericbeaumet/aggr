name: Install aggr
description: Install the aggr binary matching this workflow or action commit.

inputs:
  version:
    description: Release to install, e.g. `1.2.3`. By default, use this commit's VERSION file.
    required: false
    default: ""
  token:
    description: Token used to query and download releases (avoids API rate limits).
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        # These contexts are passed through the environment inside a composite action.
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: aymericbeaumet/aggr
      run: |
        set -euo pipefail

        # Explicit input > semver action ref > VERSION at this exact commit > latest.
        version="${INPUT_VERSION#v}"
        if [ -z "$version" ] && [[ "$ACTION_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          version="${ACTION_REF#v}"
        fi
        if [ -z "$version" ] && [ -f "$ACTION_PATH/../../../VERSION" ]; then
          version="$(tr -d '[:space:]' < "$ACTION_PATH/../../../VERSION")"
        fi
        if [ -z "$version" ]; then
          version="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
          version="${version#v}"
        fi

        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        if [ "$os" = windows ]; then archive="aggr-$os-$arch.zip"; else archive="aggr-$os-$arch.tar.gz"; fi

        dir="$RUNNER_TEMP/aggr/bin"
        mkdir -p "$dir"
        cd "$RUNNER_TEMP/aggr"
        gh release download "v$version" --repo "$REPO" --pattern "$archive" --pattern SHA256SUMS --clobber
        grep -F " $archive" SHA256SUMS | sha256sum -c -
        if [ "$os" = windows ]; then unzip -oq "$archive" -d bin; else tar -xzf "$archive" -C bin; fi

        echo "$dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "installed aggr $version ($os-$arch)"
