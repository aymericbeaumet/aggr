name: native-deps
description: >-
  Installs native libraries and compiler support for the BoringSSL build behind wreq.
  Rust, CMake, Ninja and Windows x64 NASM come from the repository's mise configuration; clang-sys locates
  Xcode's libclang on macOS without Homebrew llvm or LIBCLANG_PATH.

runs:
  using: composite
  steps:
    - name: Verify native TLS build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/linux.sh"

    - name: Configure native Windows compiler environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

    - name: Configure native TLS build dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
        if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
          throw "The runner's native LLVM installation is missing libclang.dll"
        }
        "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
        $llvmBin >> $env:GITHUB_PATH
        'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
        if ('${{ runner.arch }}' -eq 'ARM64') {
          'CC=clang-cl' >> $env:GITHUB_ENV
          'CXX=clang-cl' >> $env:GITHUB_ENV
          'ASM=clang-cl' >> $env:GITHUB_ENV
        }
