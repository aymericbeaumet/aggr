name: release

# Tag-driven: bump `version` in Cargo.toml and VERSION, commit, `git tag vX.Y.Z`, push the tag.
# Stable reusable workflows resolve the newest compatible binary through their major channel.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cargo="$(perl -ne 'print $1 if /^version = "(.*)"/' Cargo.toml)"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$cargo" ] || [ "$version" != "$file" ]; then
            echo "tag $TAG, Cargo.toml $cargo and VERSION $file disagree"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.name }})
    needs: [verify, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-amd64, os: macos-15-intel }
          - { name: darwin-arm64, os: macos-latest }
          - { name: windows-amd64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native TLS build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake libclang-dev build-essential
      - name: Install native TLS build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Configure native Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Configure native TLS build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw "The runner's native LLVM installation is missing libclang.dll"
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          $llvmBin >> $env:GITHUB_PATH
          'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
          if ('${{ runner.arch }}' -eq 'ARM64') {
            'CC=clang-cl' >> $env:GITHUB_ENV
            'CXX=clang-cl' >> $env:GITHUB_ENV
            'ASM=clang-cl' >> $env:GITHUB_ENV
          } else {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            (Join-Path $env:ProgramFiles 'NASM') >> $env:GITHUB_PATH
          }
          cmake --version
          ninja --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release --locked
      - shell: bash
        env:
          ARCHIVE: aggr-${{ matrix.name }}
        run: |
          mkdir dist
          if [[ "$ARCHIVE" == aggr-windows-* ]]; then
            (cd target/release && 7z a "../../dist/$ARCHIVE.zip" aggr.exe)
          else
            tar -C target/release -czf "dist/$ARCHIVE.tar.gz" aggr
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aggr-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*
