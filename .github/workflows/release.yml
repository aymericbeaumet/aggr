name: release

# Tag-driven: bump `version` in Cargo.toml and VERSION, commit, `git tag vX.Y.Z`, push the tag.
# Stable reusable workflows resolve the newest compatible binary through their major channel.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cargo="$(perl -ne 'print $1 if /^version = "(.*)"/' Cargo.toml)"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$cargo" ] || [ "$version" != "$file" ]; then
            echo "tag $TAG, Cargo.toml $cargo and VERSION $file disagree"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.name }})
    needs: [verify, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-amd64, os: macos-15-intel }
          - { name: darwin-arm64, os: macos-26 }
          - { name: windows-amd64, os: windows-2025 }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked rust cmake ninja
      - name: Install Windows x64 assembler
        if: matrix.name == 'windows-amd64'
        run: mise install --locked http:nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Release builds only ever run on tag refs, whose caches main and pull requests can
          # never restore; restore the branch caches but never add tag-scoped entries.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise run release
      - name: Verify the installable CLI
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          binary=target/release/aggr
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          test "$("$binary" --version)" = "aggr $VERSION"
          "$binary" dev --help > dev-help.txt
          grep -q -- '--no-watch' dev-help.txt
      - shell: bash
        env:
          ARCHIVE: aggr-${{ matrix.name }}
        run: |
          mkdir dist
          cp LICENSE THIRD_PARTY_NOTICES target/release/
          if [[ "$ARCHIVE" == aggr-windows-* ]]; then
            (cd target/release && 7z a "../../dist/$ARCHIVE.zip" aggr.exe LICENSE THIRD_PARTY_NOTICES)
          else
            tar -C target/release -czf "dist/$ARCHIVE.tar.gz" aggr LICENSE THIRD_PARTY_NOTICES
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aggr-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*

  publish-crates:
    needs: release
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
