name: publish crates

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: crates.io token permitted to publish aggr-ui-model, aggr-ui-build, aggr-lib and aggr
        required: false

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.15
          install_args: rust cmake ninja
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          save-if: false
      - run: mise run publish-test
      - name: Publish missing crate versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: mise run publish
