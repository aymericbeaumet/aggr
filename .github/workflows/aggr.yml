name: aggr

# Reusable workflow: the one line a reader repository needs.
#
#   jobs:
#     aggr:
#       uses: aymericbeaumet/aggr/.github/workflows/aggr.yml@v1
#
# Fetches every source, appends new items to the data branch, renders the site, and deploys it to
# GitHub Pages. The caller must grant `contents: write, pages: write, id-token: write`.

on:
  workflow_call:
    inputs:
      config:
        description: Path to aggr.toml, relative to the repository root.
        type: string
        default: aggr.toml
      pages:
        description: Deploy the site to GitHub Pages. Off, the site is only kept as a run artifact.
        type: boolean
        default: true
    outputs:
      url:
        description: Where the site was deployed.
        value: ${{ jobs.aggr.outputs.url }}

jobs:
  aggr:
    runs-on: ubuntu-latest
    # Serialize sync and deploy across all callers. Keep the active run and one pending run;
    # newer arrivals replace the pending run because each sync fetches the latest content.
    concurrency:
      group: aggr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      AGGR_CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v7

      # `@v1` is the stable workflow contract. Its major-channel input resolves the greatest
      # published v1.x.y binary at run time, independently of workflow changes.
      - uses: aymericbeaumet/aggr@v1
        with:
          version: 1
          token: ${{ github.token }}

      # Derived state about bytes the site already publishes is safe to carry between runners and
      # invalidates itself: image receipts and the Pagefind index are keyed by their inputs,
      # backoff markers carry their own timestamps, and feed-parser receipts name the parser
      # version. Without it every run validates every image cold, re-indexes search, fetches
      # every feed unconditionally and retries known-dead pages.
      #
      # Raw original-page responses (articles-v1) are private and never leave the runner. The
      # rendered site (render-v1) is not cached here either: its fingerprint changes whenever any
      # item crosses an age band, so a multi-gigabyte entry would be uploaded every run and almost
      # never hit, exhausting the repository's Actions cache quota.
      #
      # Every run saves under its own key and the next run restores the newest entry by prefix.
      # The path list is checked against the registry in src/cache.rs by a unit test.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .aggr/cache/build-v1/discussions-v1
            .aggr/cache/build-v1/pagefind-v1
            .aggr/cache/build-v1/validated-images-v2
            .aggr/cache/build-v1/image-failures-v1
            .aggr/cache/build-v1/capture-retries-v1
            .aggr/cache/build-v1/recording-duration-v1
            .aggr/cache/build-v1/feed-parsing
          key: aggr-state-v1-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            aggr-state-v1-${{ github.repository_id }}-

      # Switches Pages to "GitHub Actions" on first run and reports the URL the site will live at
      # (the custom domain when one is configured in the repository settings).
      - id: pages
        if: inputs.pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Build starts with a sync. The Pages URL wins over `[site] url`; without Pages the config
      # must name the host.
      - run: aggr build --release --out "$GITHUB_WORKSPACE/_site"
        env:
          AGGR_BASE_URL: ${{ steps.pages.outputs.base_url }}

      # Saved only after a successful build so a failed run never publishes half-written state.
      - uses: actions/cache/save@v4
        with:
          path: |
            .aggr/cache/build-v1/discussions-v1
            .aggr/cache/build-v1/pagefind-v1
            .aggr/cache/build-v1/validated-images-v2
            .aggr/cache/build-v1/image-failures-v1
            .aggr/cache/build-v1/capture-retries-v1
            .aggr/cache/build-v1/recording-duration-v1
            .aggr/cache/build-v1/feed-parsing
          key: aggr-state-v1-${{ github.repository_id }}-${{ github.run_id }}

      - if: inputs.pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - if: ${{ !inputs.pages }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

      - id: deploy
        if: inputs.pages
        uses: actions/deploy-pages@v4
