name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-amd64, os: macos-15-intel }
          - { name: windows-amd64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.11
          install_args: rust cmake ninja
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # The linux-amd64 leg produces the cache the browser job restores; the other legs keep
          # their automatic per-job key.
          shared-key: ${{ matrix.name == 'linux-amd64' && 'linux-x64' || '' }}
          # release.yml re-runs this workflow on the tag ref; caches saved there can never be
          # restored by main or pull requests and only eat the repository's cache quota.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise exec -- cargo fmt --all -- --check
        if: matrix.name == 'linux-amd64'
      - run: mise exec -- cargo clippy --locked --all-targets -- -D warnings
      - run: mise exec -- cargo test --locked
      # `cargo test` exports the client's TypeScript types with ts-rs; stale bindings fail here.
      - name: Generated client types are committed
        if: matrix.name == 'linux-amd64'
        run: git diff --exit-code -- web/src/generated

  browser:
    name: browser (chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      AGGR_WEBDRIVER_URL: http://127.0.0.1:9515
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.11
          install_args: rust cmake ninja chromedriver
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore what test (linux-amd64) built for the same lockfile instead of keeping a
          # second copy of it.
          shared-key: linux-x64
          save-if: false
      - name: Install pinned Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser_dir="$(mktemp -d "$RUNNER_TEMP/aggr-chrome.XXXXXX")"
          # mise.toml pins the driver to an exact Chrome for Testing release.
          browser_version="$(mise exec -- chromedriver --version | awk '{ print $2 }')"
          curl --fail --silent --show-error --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/$browser_version/linux64/chrome-linux64.zip" \
            --output "$browser_dir/chrome.zip"
          unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
          mapfile -t dependencies < "$browser_dir/chrome-linux64/deb.deps"
          sudo apt-get update -qq
          sudo apt-get satisfy -y --no-install-recommends "${dependencies[@]}"
          "$browser_dir/chrome-linux64/chrome" --version
          mise exec -- chromedriver --version
          echo "AGGR_CHROME_BINARY=$browser_dir/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Test reader and offline browser contracts
        shell: bash
        env:
          # Two sessions share a 4-vCPU runner; a cold Chrome start under that load needs more
          # than the harness default.
          AGGR_BROWSER_TIMEOUT_SECS: "90"
        run: |
          set -euo pipefail
          mkdir -p target/browser-artifacts
          mise exec -- chromedriver --port=9515 --allowed-ips=127.0.0.1 \
            --log-path=target/browser-artifacts/chromedriver.log \
            > target/browser-artifacts/chromedriver-server.log 2>&1 &
          browser_driver_pid=$!
          trap 'kill "$browser_driver_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..40}; do
            if curl --fail --silent "$AGGR_WEBDRIVER_URL/status" | jq -e '.value.ready == true' > /dev/null; then
              break
            fi
            kill -0 "$browser_driver_pid"
            sleep 0.25
          done
          curl --fail --silent --show-error "$AGGR_WEBDRIVER_URL/status" | jq -e '.value.ready == true'
          mise exec -- cargo test --locked --test browser -- --ignored --nocapture --test-threads=2
      - name: Upload browser failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-chrome-failure
          path: target/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(perl -ne 'print $1 if /^rust-version = "(.*)"/' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.11
          install: false
      - run: mise install rust@${{ steps.msrv.outputs.version }} cmake ninja
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise exec rust@${{ steps.msrv.outputs.version }} -- cargo build --locked

  # The Svelte client: type-check, unit tests, then a rebuild that must reproduce the committed
  # bundles under src/theme/static/app (Node is a development tool only; the binary embeds
  # the committed output).
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.11
          install_args: node
      - run: mise exec -- npm ci --prefix web
      - run: mise exec -- npm --prefix web run verify
      - name: Committed client assets match the sources
        run: |
          git add --intent-to-add -- src/theme/static/app
          git diff --exit-code -- src/theme/static/app

  # Licenses, RustSec advisories, duplicate versions and registry sources of the dependency tree,
  # as configured in deny.toml. Use the same mise-pinned cargo-deny as local development.
  deps:
    name: deps (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.11
          install_args: aqua:EmbarkStudios/cargo-deny
      - run: mise exec -- cargo-deny --locked --all-features check

  # The version is committed in two places; keep them equal before anything gets tagged.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cargo="$(perl -ne 'print $1 if /^version = "(.*)"/' Cargo.toml)"
          file="$(tr -d '[:space:]' < VERSION)"
          [ "$cargo" = "$file" ] || { echo "Cargo.toml says $cargo, VERSION says $file"; exit 1; }

  # Exercise the same major-channel resolution used by the stable reusable workflow.
  installer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: aymericbeaumet/aggr
        run: |
          declared="$(tr -d '[:space:]' < VERSION)"
          major="${declared%%.*}"
          latest="$(gh release list \
            --repo "$RELEASE_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1000 \
            --json tagName \
            --jq "map(select(.tagName | test(\"^v${major}\\\\.[0-9]+\\\\.[0-9]+$\"))) | max_by(.tagName | ltrimstr(\"v\") | split(\".\") | map(tonumber)) | .tagName // empty")"
          [ -n "$latest" ] || { echo "no published v$major release"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "expected=${latest#v}" >> "$GITHUB_OUTPUT"
      - id: install-major
        uses: ./
        with:
          version: ${{ steps.release.outputs.major }}
      - env:
          EXPECTED: ${{ steps.release.outputs.expected }}
        run: |
          actual="$(aggr --version | awk '{ print $2 }')"
          [ "$actual" = "$EXPECTED" ] || { echo "installed $actual, expected $EXPECTED"; exit 1; }
