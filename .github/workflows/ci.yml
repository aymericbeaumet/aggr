name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-26 }
          - { name: macos-amd64, os: macos-15-intel }
          - { name: windows-amd64, os: windows-2025 }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked rust cmake ninja http:typescript-native
      - name: Install Windows x64 assembler
        if: matrix.name == 'windows-amd64'
        run: mise install --locked http:nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # The linux-amd64 leg produces the cache the browser job restores; the other legs keep
          # their automatic per-job key.
          shared-key: ${{ matrix.name == 'linux-amd64' && 'linux-x64' || '' }}
          # release.yml re-runs this workflow on the tag ref; caches saved there can never be
          # restored by main or pull requests and only eat the repository's cache quota.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise run fmt-check
        if: matrix.name == 'linux-amd64'
      - run: mise run lint
      - run: mise run test

  browser:
    name: browser (chrome)
    runs-on: ubuntu-24.04
    # The cache can be cold: native Rolldown, QuickJS and BoringSSL compile before the tests.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AGGR_WEBDRIVER_URL: http://127.0.0.1:9515
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked rust cmake ninja http:chromedriver http:chrome-for-testing
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reuse previous test (linux-amd64) builds when available. Jobs run concurrently,
          # so a new dependency graph must also succeed without a warm cache.
          shared-key: linux-x64
          save-if: false
      - name: Verify pinned Chrome runtime
        shell: bash
        run: |
          bash .github/actions/native-deps/chrome.sh
          mise exec -- chromedriver --version
      - name: Test reader and offline browser contracts
        shell: bash
        env:
          # Two sessions share a 4-vCPU runner; a cold Chrome start under that load needs more
          # than the harness default.
          AGGR_BROWSER_TIMEOUT_SECS: "90"
        run: |
          set -euo pipefail
          mkdir -p target/browser-artifacts
          mise exec -- chromedriver --port=9515 --allowed-ips=127.0.0.1 \
            --log-path=target/browser-artifacts/chromedriver.log \
            > target/browser-artifacts/chromedriver-server.log 2>&1 &
          browser_driver_pid=$!
          trap 'kill "$browser_driver_pid" 2>/dev/null || true' EXIT
          for _attempt in {1..40}; do
            if curl --fail --silent "$AGGR_WEBDRIVER_URL/status" | jq -e '.value.ready == true' > /dev/null; then
              break
            fi
            kill -0 "$browser_driver_pid"
            sleep 0.25
          done
          curl --fail --silent --show-error "$AGGR_WEBDRIVER_URL/status" | jq -e '.value.ready == true'
          mise run browser-test -- --nocapture --test-threads=2
      - name: Upload browser failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-chrome-failure
          path: target/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: echo "version=$(perl -ne 'print $1 if /^rust-version = "(.*)"/' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install: false
      # The task runner is compiled with project Rust before it selects the minimum version.
      - run: mise install --locked rust cmake ninja
      - run: mise install rust@${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise run msrv

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-deps
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked rust cmake ninja http:typescript-native http:chromedriver http:chrome-for-testing
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify pinned Chrome runtime
        shell: bash
        run: bash .github/actions/native-deps/chrome.sh
      - run: mise run client-check

  # Licenses, RustSec advisories, duplicate versions and registry sources of the dependency tree,
  # as configured in deny.toml. Use the same mise-pinned cargo-deny as local development.
  deps:
    name: deps (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked rust aqua:EmbarkStudios/cargo-deny
      - run: mise run deps-check

  workflows:
    name: workflows (jactionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked github:jdx/jactionlint shellcheck
      - run: mise run workflow-check

  # The version is committed in two places; keep them equal before anything gets tagged.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cargo="$(perl -ne 'print $1 if /^version = "(.*)"/' Cargo.toml)"
          file="$(tr -d '[:space:]' < VERSION)"
          [ "$cargo" = "$file" ] || { echo "Cargo.toml says $cargo, VERSION says $file"; exit 1; }

  # Exercise a published major channel. A new major has no release until this workflow passes,
  # so test the previous published channel during bootstrap and the new one after publication.
  installer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: aymericbeaumet/aggr
        run: |
          declared="$(tr -d '[:space:]' < VERSION)"
          major="${declared%%.*}"
          latest=""
          while [ "$major" -ge 1 ]; do
            latest="$(gh release list \
              --repo "$RELEASE_REPOSITORY" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1000 \
              --json tagName \
              --jq "map(select(.tagName | test(\"^v${major}\\\\.[0-9]+\\\\.[0-9]+$\"))) | max_by(.tagName | ltrimstr(\"v\") | split(\".\") | map(tonumber)) | .tagName // empty")"
            [ -n "$latest" ] && break
            major="$((major - 1))"
          done
          [ -n "$latest" ] || { echo "no published aggr release to test"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "expected=${latest#v}" >> "$GITHUB_OUTPUT"
      - id: install-major
        uses: ./
        with:
          version: ${{ steps.release.outputs.major }}
      - env:
          EXPECTED: ${{ steps.release.outputs.expected }}
        run: |
          actual="$(aggr --version | awk '{ print $2 }')"
          [ "$actual" = "$EXPECTED" ] || { echo "installed $actual, expected $EXPECTED"; exit 1; }
