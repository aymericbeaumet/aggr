# aggr.toml — every option with its default value.
#
# Copy this file as `aggr.toml` (`aggr init --defaults` does exactly that), or start from the
# minimal file `aggr init` writes and only add what you change. Unknown keys are errors.
# `${VAR}` in `url` and `headers` values expands from the environment (secrets in CI).

[defaults]
# Applied independently to every feed; each [[sources]] table can override any key.
# Light uses feed content. Heavy also downloads and extracts original article pages.
content = "light"
# Remote keeps publisher URLs. Compressed archives bounded images; local keeps original media.
# PDFs remain exact local copies in both compressed and local modes.
media = "remote"
# Per-feed retained items, publication age, and logical article bytes, including companions.
# Exceeding a limit removes whole articles and their companions in ordinary commits; Git history stays.
# Zero disables an individual numeric limit. Multiple limits apply together.
max_items = 250
max_age_days = 730
max_bytes = 1000000000
# Optional inclusive UTC date, combined with max_age_days using the newer cutoff.
# since = "2026-01-01"
# Tune only compressed media: quality is 1-100 and max_axis is 320-8192.
# media = { mode = "compressed", quality = 72, max_axis = 1600 }
# Compressed raster copies preserve transparency and animation where supported. Formats that
# cannot be safely reduced retain their originals. Later policy changes do not re-download
# existing masters; sync --backfill-media fills missing media without rewriting article bodies.

[site]
# Name shown in the navigation bar and feed metadata.
title = "aggr"
# Optional summary used in search results, social cards, feeds, and the PWA manifest.
# description = "My independent, searchable snapshot of the feeds I follow."
# BCP 47 language tag used by HTML and feeds.
language = "en"
# Number of entries kept in each generated feed, source, category, and tag page. The reader can
# split these static pages into smaller browser-side feed pages without hiding any entry from
# no-JavaScript readers or crawlers.
items_per_page = 50
# Recent home-feed window. Source/category/tag archives include every retained article.
max_items = 5000
# Entries older than this leave the home feed but remain in archive pages.
max_age_days = 365
# "owner/repo" for permalinks; auto-detected from $GITHUB_REPOSITORY in Actions.
# repository = "owner/repo"
# Public URL used by `aggr build --release` (the workflow passes it automatically for
# *.github.io). A custom domain here also writes the CNAME file GitHub Pages needs.
# url = "https://reads.example.com"
# Allow search-engine indexing and emit a sitemap in release builds. This does not control access.
indexing = false
# Maximum generated-site bytes, including text, search, and assets (1 decimal GB by default).
# Every retained article stays readable; media is compressed or left at its publisher to fit.
build_max_bytes = 1000000000
# Keep recent articles' local media intact; compact older images in the generated site only.
# The archive's full-quality masters and Git history are never changed by a build.
media_full_quality_days = 30
# Output directory of `aggr build`.
out = "_site"
# In a secure context, emit install metadata and register the service worker that keeps
# pages you have read available offline.
pwa = true

# Initial reader settings. Every preference and its default is documented here.
# Each visitor's saved preferences override these defaults; Reset restores these site values.
[site.preferences]
theme = "auto" # auto, light, dark, sepia
date_format = "relative" # relative, iso, local, local-time
text_size = "default" # default, large, largest
reading_width = "standard" # narrow, standard, wide
font_family = "sans" # sans, serif, mono
line_spacing = "standard" # compact, standard, relaxed
paragraph_spacing = "standard" # compact, standard, relaxed
paragraph_indent = false
text_align = "left" # left, justify
letter_spacing = "normal" # normal, wide
word_spacing = "normal" # normal, wide
density = "compact" # compact, comfortable
thumbnails = "show" # show, hide
feed_page_size = 50 # 10, 25, 50
motion = "auto" # auto, off
single_key_shortcuts = true
scroll_amount = 10 # 1–100 lines for d/u, capped at half the available viewport
# Recent complete articles and their archived images to download (0–1000); 0 disables downloads.
offline_items = 0

# Optional public identity for Schema.org metadata. `type` is "person" or "organization".
# [site.identity]
# type = "person"
# name = "Ada Example"
# url = "https://example.com/ada"
# same_as = ["https://social.example/@ada"]

# Optional networks searched for conversations about each article. No matching is done by default.
# They add per-item links, find the highest-engagement exact match when possible, and otherwise
# fall back to search. `{url}` and `{title}` are URL-encoded.
# [[networks]]
# provider = "hackernews"
# [[networks]]
# provider = "reddit"
# [[networks]]
# provider = "x"
# A custom search needs a label and URL template instead:
# [[networks]]
# name = "Lobsters"
# url = "https://lobste.rs/search?q={url}"

# Free-form values available to templates as `site.params`.
[site.params]

[store]
# Orphan, append-only branch holding every item. Never force-push it.
branch = "aggr"
# Worktree of that branch, relative to the repository root (ignored via .git/info/exclude).
dir = ".aggr/data"
# Keep the raw .html next to each .md (per-source `html = false` overrides).
html = true
# Maximum bytes kept in each sanitized raw HTML sibling.
html_max_bytes = 262144

[fetch]
# Maximum source requests running concurrently.
concurrency = 16
# Concurrent original-page downloads within each source in `heavy` mode.
article_concurrency = 4
# Total timeout for one HTTP request, in seconds.
timeout_secs = 20
# Maximum response body accepted from a feed, discovery page, or article, in bytes (up to
# 16777216, the bounded persistent-cache reader limit).
max_body_bytes = 10000000
# Retries after transient HTTP failures. Retries use deterministic exponential backoff.
retries = 2
# Whether a remote source collection may itself name another absolute remote collection. Relative
# files and wildcards in the same remote repository are always allowed. Keep this false unless
# every collection in the transitive chain is trusted.
allow_remote_source_chains = false
[cache]
# Disposable caches are bounded independently of the append-only archive and published site.
media_max_bytes = 2147483648
response_max_bytes = 268435456

# Each table's `url` names one or more resources: websites, RSS/Atom/JSON feeds, aggr TOML,
# OPML subscriptions, or newline-separated URL lists. Resources can be local paths or remote
# URLs; aggr detects the content automatically. Accepts a string, multiline string, or array of
# strings (including multiline strings): split lines, strip trailing " #" comments, trim, discard blanks.
# Hashes without a preceding space remain part of the URL.
# Options on the table apply to every expanded source. Place complete [[sources]] tables between
# any other sections. Use separate tables for groups. Normal website URLs discover feeds.
# In heavy mode, aggr can discover article cards when no usable feed is available.
# [[sources]]
# url = "https://blog.rust-lang.org"
# name = "Rust Blog"          # display name; the feed title when unset
# slug = "rust-blog"          # directory under items/; from the name, else the source's
#                             # canonical name (example.com, youtube.com/@channel)
# category = "rust"           # optional; an item belongs to at most one category
# An item has one category and any number of labels. Source labels are merged with feed labels.
# labels = ["programming", "rust"]
# headers = { Authorization = "Bearer ${TOKEN}" } # `${ENV}` values are expanded
# html = false               # override [store] html for this source
# content = "heavy"          # override [defaults] content
# media = "compressed"       # remote, compressed, local, or the compression table above
# max_items = 100             # override only this count; age and byte limits still inherit
# max_age_days = 0            # disable the relative-age limit for this source
# max_bytes = 500000000       # include all companions in this feed's retained-byte limit
# since = false              # explicitly clear an inherited absolute date

# Group URLs with shared options. Use another table when the options differ.
# [[sources]]
# category = "programming"
# url = """
# https://blog.rust-lang.org/
# https://example.com/feed.xml
# """
# [[sources]]
# url = ["https://example.org/feed.xml", "https://example.net/rss"]
# labels = ["science"]

# Collections expand at this position; a feed document registers one source. Local paths resolve
# relative to the file that names them. Local and GitHub wildcards work; name aggr.toml explicitly
# when importing subscriptions from a repository. Bare repository URLs import retained articles. Source options become defaults for expanded sources that do not set
# their own. Invalid, repeated and cyclic resources warn and are skipped. Remote collections may
# reference relative resources on the same origin (and GitHub repository); broader remote chains
# require `[fetch] allow_remote_source_chains` in this root config.
# [[sources]]
# url = ["./aggr-ai.toml", "./subscriptions.opml", "./feeds.txt"]
# category = "ai"
# Remote .toml/.opml/.txt URLs and GitHub config paths also expand automatically.
# Ordinary feed/page URLs are fetched only by sync, never while reading configuration.
# Mark an extensionless subscription endpoint explicitly; this flag does not pass to its sources.
# [[sources]]
# url = "https://example.com/subscriptions"
# collection = true
# [[sources]]
# url = """
# https://github.com/owner/aggr-instance/blob/main/aggr.toml
# https://example.com/subscriptions.opml
# """
# GitHub requests automatically use $GITHUB_TOKEN or $GH_TOKEN when present. Cross-repository
# private configs require a token with read access.
# [[sources]]
# url = "https://github.com/owner/aggr-instance/blob/main/topics/*.toml"

# Another aggr repository: its data branch is mirrored and its items flow into this site.
# [[sources]]
# url = "https://github.com/friend/reads" # git@github.com:friend/reads.git and SSH also work
# Alternative URL: git@github.com:friend/reads.git or https://host/x/reads.git
# branch = "aggr"             # its data branch
# sources = []                # only these of its source slugs; all when empty
# max_items = 200             # per-feed count, including repository imports
# category = "friends"
