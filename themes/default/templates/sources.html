{% extends "base.html" %}
{% block content %}
<section class="page" aria-labelledby="page-title">
  <header class="page-header"><h1 id="page-title">{{ page.title }}</h1></header>
  <div class="page-body">
  {% if sources %}
    {% set entries = sources %}{% include "_directory.html" %}
  {% else %}
    <p class="empty">No sources configured. Add a <code>[[sources]]</code> entry to <code>aggr.toml</code>.</p>
  {% endif %}
  </div>
</section>
{% endblock %}
