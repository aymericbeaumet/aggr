{% extends "base.html" %}
{% block content %}
<h1>{{ page.title }}</h1>
<ul class="taxonomy-list">
{% for term in (categories if page.kind == 'categories' else tags) %}
  <li><a href="{{ term.page | url_for }}">{{ term.name }}</a> <span class="muted">{{ term.count }}</span></li>
{% endfor %}
</ul>
{% endblock %}
