{% extends "base.html" %}
{% block content %}
<section class="page" aria-labelledby="page-title">
  <header class="page-header"><h1 id="page-title">{{ page.title }}</h1></header>
  <div class="page-body">
    <ul class="taxonomy-list" role="list" aria-label="{{ page.title }}">
    {% for term in (categories if page.kind == 'categories' else tags) %}
      {% if term.count > 0 %}<li><a href="{{ term.page | url_for }}">{{ '#' if page.kind == 'tags' }}{{ term.name }}</a> <span class="muted" aria-label="{{ term.count }} items">{{ term.count }}</span></li>{% endif %}
    {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
