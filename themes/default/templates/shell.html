{% extends "base.html" %}
{# Pagefind full-text search: the static index and UI are both loaded by app.js. #}
{% block content %}
<div class="listhead">
  <h1>{{ page.title }}</h1>
  <div class="listtools">
    <input id="q" type="search" placeholder="Search titles and full text…" autofocus autocomplete="off">
    <select id="category-filter" aria-label="Category"><option value="">all categories</option></select>
    <select id="tag-filter" aria-label="Tag"><option value="">all tags</option></select>
    <select id="search-sort" aria-label="Sort"><option value="relevance">relevance</option><option value="newest">newest</option></select>
    <span id="count" class="muted"></span>
  </div>
</div>
<ol class="rows" id="list" data-shell="{{ page.kind }}"></ol>
<p class="empty" id="empty" hidden>
  Type to search the most recent items.
</p>
<noscript><p class="empty">Full-text search needs JavaScript.</p></noscript>
{% endblock %}
