{% extends "base.html" %}
{# Pagefind full-text search: the static index and UI are both loaded by app.js. #}
{% block content %}
<section class="page" aria-labelledby="page-title">
  <header class="page-header"><h1 id="page-title">{{ page.title }}</h1></header>
  <div class="page-body">
    <form class="search-controls" id="search-form" role="search">
      <label class="sr-only" for="q">Search titles and full text</label>
      <input id="q" name="q" type="search" placeholder="Search titles and full text…" autofocus autocomplete="off" aria-controls="list" spellcheck="false">
      <label class="sr-only" for="category-filter">Filter by category</label>
      <select id="category-filter" name="category"><option value="">all categories</option></select>
      <label class="sr-only" for="tag-filter">Filter by tag</label>
      <select id="tag-filter" name="tag"><option value="">all tags</option></select>
      <label class="sr-only" for="search-sort">Sort results</label>
      <select id="search-sort" name="sort"><option value="relevance">relevance</option><option value="newest">newest</option></select>
      <output id="count" class="search-count muted" for="q category-filter tag-filter search-sort" role="status" aria-live="polite" aria-atomic="true">0</output>
    </form>
    <ol class="rows search-results" id="list" data-shell="{{ page.kind }}" aria-label="Search results"></ol>
    <p class="empty" id="empty">Type to search the most recent items.</p>
    <noscript><p class="empty">Full-text search needs JavaScript.</p></noscript>
  </div>
</section>
{% endblock %}
