{% extends "base.html" %}
{# Client-side full-text search: app.js fills #list from search.json. #}
{% block content %}
<div class="listhead">
  <h1>{{ page.title }}</h1>
  <div class="listtools">
    <input id="q" type="search" placeholder="Search titles and full text…" autofocus autocomplete="off">
    <span id="count" class="muted"></span>
  </div>
</div>
<ol class="rows" id="list" data-shell="{{ page.kind }}"></ol>
<p class="empty" id="empty" hidden>
  Type to search the most recent items.
</p>
<noscript><p class="empty">Full-text search needs JavaScript.</p></noscript>
{% endblock %}
